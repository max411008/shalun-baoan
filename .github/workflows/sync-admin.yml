name: 後台同步
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 3 1 * *"   # 每月一次保活（GitHub 會停用 60 天沒動的排程）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-admin
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python tools/sync_admin.py
      - name: 有變動才提交
        run: |
          if [ "${{ github.event.schedule }}" = "17 3 1 * *" ]; then date -u +%FT%TZ > .keepalive; fi
          for p in content.json img/u .keepalive; do [ -e "$p" ] && git add -A "$p"; done
          git add -A -u img 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name="後台同步" -c user.email="actions@users.noreply.github.com" commit -m "後台內容更新"
          git push
